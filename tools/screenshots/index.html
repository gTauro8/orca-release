<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Release Control — demo</title>
<style>
  /* Orca's dark theme variables, which the host normally injects into the editor frame */
  :root {
    color-scheme: dark;
    --orca-background: #0a0a0a; --orca-foreground: #ededed;
    --orca-card: #141414; --orca-card-foreground: #ededed;
    --orca-popover: #171717; --orca-popover-foreground: #ededed;
    --orca-primary: #ededed; --orca-primary-foreground: #0a0a0a;
    --orca-secondary: #262626; --orca-secondary-foreground: #ededed;
    --orca-muted: #1f1f1f; --orca-muted-foreground: #a1a1a1;
    --orca-accent: #262626; --orca-border: #2a2a2a; --orca-input: #2a2a2a; --orca-ring: #737373;
    --orca-radius: 8px;
  }
  html, body { margin: 0; height: 100%; background: var(--orca-background); color: var(--orca-foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<script src="board.js"></script>
</body>
</html>
